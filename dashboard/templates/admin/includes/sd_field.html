<div class="sd-field{% if field.errors %} invalid{% endif %}">
  <label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
  {{ field }}
  {% for e in field.errors %}<div class="sd-err">{{ e }}</div>{% endfor %}
  {% if hint|default:field.help_text %}<div class="sd-hintline">{{ hint|default:field.help_text }}</div>{% endif %}
</div>
