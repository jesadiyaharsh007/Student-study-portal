{% extends 'dashboard/base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container">
  <form method="POST">
    {% csrf_token %}
    <fieldset class="form-group">
      <legend class="border-bottom mb-4">Student Log In</legend>
      {{ form|crispy }}
    </fieldset>
    <div class="form-group">
      <button class="btn btn-outline-info" type="submit">
        Sign In
      </button>
    </div>
  </form>
  <div class="border-top pt-3 d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center">
    <small class="text-muted mb-2 mb-sm-0">Need a Student Account?
      <a class="ml-2 font-weight-bold" href="{% url 'register' %}">Create an Account</a>
    </small>
    <small class="text-muted">
      Administrator? <a class="text-primary font-weight-bold ml-1" href="/admin/"><i class="fas fa-shield-alt mr-1"></i>Admin Portal Login</a>
    </small>
  </div>
</div>
{% endblock content %}
