<div class="ring" style="--size:{{ size|default:'120px' }};--pct:{{ pct|default:0 }}" data-pct="{{ pct|default:0 }}"{% if ring_id %} id="{{ ring_id }}" data-total="{{ total }}"{% endif %}>
  <svg viewBox="0 0 44 44" aria-hidden="true"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" cx="22" cy="22" r="18" pathLength="100"/></svg>
  <div class="num"><span><span data-ring-num>{{ pct|default:0 }}</span><small>%</small></span></div>
</div>
