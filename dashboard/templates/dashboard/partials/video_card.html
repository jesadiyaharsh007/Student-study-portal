<a class="vid" href="{% url 'youtube-watch' v.id %}" style="--i:{{ forloop.counter0|default:0 }}">
  <span class="vid-thumb"><img src="{{ v.thumbnail }}" alt="" width="320" height="180" loading="lazy" decoding="async">{% if v.topic_label %}<i class="vid-tag">{{ v.topic_label }}</i>{% endif %}</span>
  <span class="vid-title">{{ v.title }}</span>
  <span class="vid-meta">
    <span class="vid-avatar" aria-hidden="true">{% if v.channel_avatar %}<img src="{{ v.channel_avatar }}" alt="" width="28" height="28" loading="lazy">{% else %}{{ v.channel|slice:":1" }}{% endif %}</span>
    <span class="vid-byline"><span class="vid-channel">{{ v.channel }}</span>{% if v.published %}<span class="vid-date">{{ v.published|date:"j M Y" }}</span>{% endif %}</span>
  </span>
</a>
